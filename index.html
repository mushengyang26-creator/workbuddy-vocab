<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>英文單字學習</title>
  <style>
    :root {
      --bg: #ebe4d6;
      --paper: #fffaf2;
      --ink: #221b14;
      --muted: #7c7266;
      --line: #e6d9c4;
      --accent: #2f6a57;
      --accent-deep: #245445;
      --accent-soft: #e3f0ea;
      --ok: #1f7a4d;
      --ok-bg: #e3f6ea;
      --bad: #c04a3c;
      --bad-bg: #fdecea;
      --shadow: 0 18px 40px rgba(54, 38, 16, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: "PingFang TC", "Noto Sans TC", "Hiragino Sans CNS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 12% -8%, rgba(255, 248, 232, 0.95), transparent 56%),
        radial-gradient(700px 380px at 110% 8%, rgba(186, 214, 198, 0.35), transparent 50%),
        var(--bg);
      padding: 28px 16px 48px;
    }
    .wrap { width: 100%; max-width: 1100px; margin: 0 auto; }
    .study-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
    }
    .study-bar .ghost { padding: 8px 0; }
    .study-bar .week-now {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 650;
    }
    [hidden] { display: none !important; }
    @media (min-width: 800px) {
      body { padding: 52px 56px 80px; }
      header { margin-bottom: 28px; }
      .badge { margin-bottom: 14px; padding: 5px 12px; font-size: 0.78rem; }
      h1 { font-size: 2.15rem; margin-bottom: 10px; }
      .sub { font-size: 1.08rem; }
      .weeks { gap: 12px; margin: 32px 0 20px; }
      .weeks button { padding: 10px 20px; font-size: 1rem; }
      .week-note { font-size: 0.98rem; margin: 0 0 10px; }
      .study-bar { margin: 0 0 24px; }
      .study-bar .week-now { font-size: 1.05rem; }
      .tabs {
        padding: 6px;
        max-width: 520px;
        margin: 0 auto 32px;
      }
      .tabs button { padding: 13px 18px; font-size: 1.05rem; }
      .meta { font-size: 1rem; margin-bottom: 14px; }
      .progress { height: 5px; margin-bottom: 20px; }
      .stage { margin-bottom: 22px; }
      body.in-week { padding: 36px 48px 48px; }
      .card { height: min(68vh, 640px); }
      .face { padding: 56px 64px; border-radius: 32px; }
      .card .en { font-size: clamp(3.8rem, 7vw, 5.4rem); }
      .card .zh { font-size: clamp(2.5rem, 3.8vw, 3.2rem); line-height: 1.4; }
      .lang { top: 24px; left: 28px; font-size: 0.8rem; }
      .hint { bottom: 26px; font-size: 0.95rem; }
      .card-actions {
        max-width: 640px;
        margin: 0 auto 16px;
        gap: 16px;
      }
      .card-actions button { padding: 18px 20px; font-size: 1.2rem; border-radius: 18px; }
      .nav {
        max-width: 560px;
        margin: 0 auto;
        gap: 14px;
      }
      .nav button, .next-btn {
        padding: 16px 18px;
        font-size: 1.05rem;
        border-radius: 18px;
      }
      .quiz-word {
        min-height: 200px;
        padding: 40px 36px;
        margin-bottom: 22px;
        border-radius: 32px;
      }
      .choices { grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 18px; }
      .choice { padding: 18px 20px; font-size: 1.12rem; border-radius: 18px; }
      .choice .mark { width: 32px; height: 32px; font-size: 0.88rem; }
      .feedback { font-size: 1.08rem; margin: 0 0 16px; }
      .summary { padding: 52px 44px; border-radius: 32px; }
      .summary h2 { font-size: 1.6rem; }
    }
    @media (max-width: 799px) {
      body.in-week { padding: 16px 14px 32px; }
    }
    header { text-align: center; margin-bottom: 16px; }
    .badge {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    h1 {
      font-size: 1.55rem;
      font-weight: 720;
      letter-spacing: 0.06em;
      margin: 0 0 6px;
    }
    .sub { color: var(--muted); font-size: 0.92rem; margin: 0; line-height: 1.5; }
    .weeks {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin: 18px 0 16px;
    }
    .weeks button {
      border: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.7);
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
    }
    .weeks button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .week-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      margin: -6px 0 16px;
    }
    .tabs {
      display: flex;
      background: rgba(255, 250, 242, 0.55);
      border: 1px solid rgba(230, 217, 196, 0.9);
      border-radius: 999px;
      padding: 4px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }
    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 650;
      padding: 11px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .tabs button.active {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 6px 16px rgba(50, 36, 16, 0.08);
    }
    .panel { display: none; }
    .panel.active { display: block; animation: rise 0.35s ease; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    .ghost {
      border: 0;
      background: transparent;
      color: var(--accent);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      padding: 0;
    }
    .progress {
      height: 4px;
      background: #e7dcc8;
      border-radius: 999px;
      margin-bottom: 14px;
      overflow: hidden;
    }
    .progress > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #3d8a70, #2f6a57);
      border-radius: inherit;
      transition: width 0.35s ease;
    }
    .stage { perspective: 1400px; margin-bottom: 16px; }
    .card {
      width: 100%;
      height: 300px;
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      -webkit-appearance: none;
      appearance: none;
      cursor: pointer;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(.2,.85,.25,1);
      transform-style: preserve-3d;
    }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.55), transparent 32%),
        var(--paper);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
    }
    .back {
      transform: rotateY(180deg);
      background:
        linear-gradient(180deg, rgba(232, 244, 237, 0.65), transparent 40%),
        #f7f1e4;
    }
    .lang {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--muted);
    }
    .en {
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: clamp(2.2rem, 8vw, 3rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0;
      text-align: center;
      color: var(--ink);
      -webkit-text-fill-color: var(--ink);
    }
    .zh {
      font-size: 1.85rem;
      font-weight: 700;
      margin: 0;
      text-align: center;
      line-height: 1.4;
      color: var(--ink);
      -webkit-text-fill-color: var(--ink);
    }
    .hint {
      position: absolute;
      bottom: 20px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .nav { display: flex; gap: 10px; }
    .nav button, .next-btn, .choice { font: inherit; cursor: pointer; }
    .nav button, .next-btn {
      flex: 1;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: 13px 14px;
      font-weight: 650;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav button:hover, .choice:hover:not(:disabled) { transform: translateY(-1px); }
    .nav button:disabled, .next-btn:disabled { opacity: 0.38; cursor: default; transform: none; }
    .quiz-word {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.55), transparent 34%),
        var(--paper);
      border-radius: 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.7);
      min-height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      margin-bottom: 16px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .quiz-word.pulse {
      animation: pulse 0.45s ease;
      box-shadow: 0 0 0 6px rgba(31, 122, 77, 0.12), var(--shadow);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .choices { display: grid; gap: 10px; margin-bottom: 12px; }
    .choices.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .choice {
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 1.05rem;
      color: var(--ink);
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }
    .choice .mark {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f3eadc;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      flex: 0 0 auto;
    }
    .choice:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
    .choice.correct { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
    .choice.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
    .choice.correct .mark, .choice.wrong .mark { background: rgba(255,255,255,0.7); color: inherit; }
    .choice:disabled { cursor: default; }
    .feedback {
      min-height: 1.5em;
      text-align: center;
      margin: 0 0 12px;
      font-weight: 700;
    }
    .feedback.ok { color: var(--ok); }
    .feedback.bad { color: var(--bad); }
    .next-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .next-btn:hover:not(:disabled) { background: var(--accent-deep); }
    .summary {
      display: none;
      background: var(--paper);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 36px 24px;
      text-align: center;
    }
    .summary.show { display: block; animation: rise 0.35s ease; }
    .summary h2 {
      margin: 0 0 8px;
      font-size: 1.35rem;
    }
    .summary p {
      margin: 0 0 22px;
      color: var(--muted);
      line-height: 1.6;
    }
    #quiz-play.empty { display: none; }
    #card-play.empty { display: none; }
    .meta-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      justify-content: flex-end;
    }
    .card-actions { display: flex; gap: 10px; margin-bottom: 12px; }
    .card-actions button {
      flex: 1;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 16px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .card-actions button:hover { transform: translateY(-1px); }
    .mark-unknown {
      background: var(--bad-bg);
      color: var(--bad);
      border-color: #f0c4be;
    }
    .mark-know {
      background: var(--ok-bg);
      color: var(--ok);
      border-color: #b7e0c6;
    }
    .pile-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.86rem;
      margin: 12px 0 0;
    }
    .summary-actions { display: grid; gap: 10px; }
    #retry-all-cards {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 16px;
      padding: 13px 14px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header id="page-header">
      <div class="badge">VOCAB</div>
      <h1>英文單字學習</h1>
      <p class="sub">學測模擬試題必備詞彙，選一週開始刷</p>
    </header>

    <div class="weeks" id="weeks"></div>
    <p class="week-note" id="week-note">選一週開始練習</p>

    <div id="study" hidden>
    <div class="study-bar">
      <button type="button" class="ghost" id="back-weeks">← 換一週</button>
      <span class="week-now" id="week-label"></span>
    </div>

    <div class="tabs">
      <button type="button" id="tab-card" class="active">單字卡</button>
      <button type="button" id="tab-quiz">選擇題</button>
    </div>

    <section id="panel-card" class="panel active">
      <div id="card-play">
      <div class="meta">
        <span id="card-count">第 1 / 0 張</span>
        <div class="meta-actions">
          <button type="button" class="ghost" id="review-unknown">只刷不會的</button>
          <button type="button" class="ghost" id="shuffle-card">打亂順序</button>
          <button type="button" class="ghost" id="reset-cards">重置</button>
        </div>
      </div>
      <div class="progress"><span id="card-progress"></span></div>
      <div class="stage">
        <button type="button" class="card" id="flashcard" aria-label="點一下翻面">
          <div class="card-inner">
            <div class="face front">
              <span class="lang">EN</span>
              <p class="en" id="card-en" title="點一下聽發音"></p>
              <span class="hint">點單字聽發音，點其他地方看中文</span>
            </div>
            <div class="face back">
              <span class="lang">中文</span>
              <p class="zh" id="card-zh"></p>
              <span class="hint">再點一下翻回英文</span>
            </div>
          </div>
        </button>
      </div>
      <div class="card-actions">
        <button type="button" class="mark-unknown" id="mark-unknown">不會</button>
        <button type="button" class="mark-know" id="mark-know">會</button>
      </div>
      <p class="pile-note" id="pile-note"></p>
      </div>
      <div class="summary" id="card-summary">
        <h2>這一輪看完了</h2>
        <p id="card-summary-text"></p>
        <div class="summary-actions">
          <button type="button" class="next-btn" id="retry-unknown">只刷不會的</button>
          <button type="button" id="retry-all-cards">再刷全部</button>
        </div>
      </div>
    </section>

    <section id="panel-quiz" class="panel">
      <div id="quiz-play">
        <div class="meta">
          <span id="quiz-progress">第 1 / 5 題</span>
          <span id="quiz-score">答對 0</span>
        </div>
        <div class="progress"><span id="quiz-bar"></span></div>
        <div class="quiz-word" id="quiz-word">
          <p class="en" id="quiz-en"></p>
        </div>
        <div class="choices" id="choices"></div>
        <p class="feedback" id="feedback"></p>
        <button type="button" class="next-btn" id="next-quiz">下一題</button>
      </div>
      <div class="summary" id="quiz-summary">
        <h2>這一組做完了</h2>
        <p id="quiz-summary-text"></p>
        <button type="button" class="next-btn" id="retry-quiz">再做一組</button>
      </div>
    </section>
    </div>
  </div>

  <script>
    // ========== 單字表：之後把新單字加在這裡 ==========
    // 格式：{ en: "英文", zh: "中文意思", week: 第幾週 },
    // 之後每週大約五個單字；選擇題每一組出五題，干擾項會優先從同一週抽取。
    const WORDS = [
      { en: "assist", zh: "協助（v.）", week: 1 },
      { en: "direction", zh: "方向（n.；複數：指示）", week: 1 },
      { en: "symptom", zh: "症狀（n.）", week: 1 },
      { en: "awake", zh: "甦醒（v.）", week: 1 },
      { en: "identity", zh: "身分（n.）", week: 1 },
      { en: "struggle", zh: "掙扎（n./v.）", week: 1 },
      { en: "confirm", zh: "確認（v.）", week: 1 },
      { en: "demand", zh: "要求（n./v.）", week: 1 },
      { en: "engage", zh: "使投入（v.）", week: 1 },
      { en: "interact", zh: "互動（v.）", week: 1 },
      { en: "recall", zh: "回憶；撤回（n./v.）", week: 1 },
      { en: "distract", zh: "使分心（v.）", week: 1 },
      { en: "approach", zh: "靠近；方法（n./v.）", week: 1 },
      { en: "conserve", zh: "保育；節約（v.）", week: 1 },
      { en: "recognize", zh: "認出（v.）", week: 1 },
      { en: "strengthen", zh: "強化（v.）", week: 1 },
      { en: "maintain", zh: "保持（v.）", week: 1 },
      { en: "enhance", zh: "改善（v.）", week: 1 },
      { en: "optimistic", zh: "樂觀的（adj.）", week: 1 },
      { en: "pessimistic", zh: "悲觀的（adj.）", week: 1 },
      { en: "cautious", zh: "小心的（adj.）", week: 1 },
      { en: "specific", zh: "明確的（adj.）", week: 1 },
      { en: "passionate", zh: "熱情的（adj.）", week: 1 },
      { en: "critical", zh: "重要的（adj.）", week: 1 },
      { en: "impressive", zh: "令人印象深刻的（adj.）", week: 1 },
      { en: "hesitate", zh: "猶豫（v.）", week: 1 },
      { en: "concern", zh: "顧慮（n./v.）", week: 1 },
      { en: "feature", zh: "特色（n./v.）", week: 1 },
      { en: "necessity", zh: "必要性；必需品（n.）", week: 1 },
      { en: "spot", zh: "地點（n.）；看到（v.）", week: 1 },
      { en: "access", zh: "取得；進入（n.）", week: 2 },
      { en: "device", zh: "裝置（n.）", week: 2 },
      { en: "degree", zh: "程度；文憑（n.）", week: 2 },
      { en: "apply", zh: "申請；應用；塗抹（v.）", week: 2 },
      { en: "capture", zh: "捕獲（v.）", week: 2 },
      { en: "credible", zh: "可信的（adj.）", week: 2 },
      { en: "application", zh: "申請（n.）", week: 2 },
      { en: "ditch", zh: "拋棄（v.）", week: 2 },
      { en: "permit", zh: "允許（v.）", week: 2 },
      { en: "determine", zh: "決定；判定（v.）", week: 2 },
      { en: "intention", zh: "意圖（n.）", week: 2 },
      { en: "exception", zh: "例外（n.）", week: 2 },
      { en: "dull", zh: "鈍的；笨的（adj.）", week: 2 },
      { en: "scarce", zh: "稀少的（adj.）", week: 2 },
      { en: "faithful", zh: "忠誠的（adj.）", week: 2 },
      { en: "hospitable", zh: "好客的（adj.）", week: 2 },
      { en: "expression", zh: "表達（n.）", week: 2 },
      { en: "appliance", zh: "家電（n.）", week: 2 },
      { en: "formal", zh: "正式的（adj.）", week: 2 },
      { en: "classical", zh: "古典的（adj.）", week: 2 },
      { en: "efficient", zh: "有效率的（adj.）", week: 2 },
      { en: "expectation", zh: "期待（n.）", week: 2 },
      { en: "effective", zh: "有效果的（adj.）", week: 2 },

    const QUESTIONS_PER_SET = 5;

    const $ = (id) => document.getElementById(id);
    const LETTERS = ["A", "B", "C", "D"];

    let currentWeek = Math.min(...WORDS.map((w) => w.week));
    let weekWords = [];
    let cardOrder = [];
    let cardIndex = 0;
    let flipped = false;
    const MASTERY_KEY = "vocab-card-mastery-v1";
    let mastery = {};
    try { mastery = JSON.parse(localStorage.getItem(MASTERY_KEY) || "{}") || {}; }
    catch (err) { mastery = {}; }
    let runMode = "all";
    let runQueue = [];
    let markedThisRound = new Set();
    let quizSet = [];
    let quizIndex = 0;
    let correctCount = 0;
    let answered = false;

    function shuffle(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function wordsOf(week) {
      return WORDS.filter((w) => w.week === week);
    }

    function weekList() {
      return [...new Set(WORDS.map((w) => w.week))].sort((a, b) => a - b);
    }

    function renderWeeks() {
      const box = $("weeks");
      box.innerHTML = "";
      weekList().forEach((week) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = "第" + week + "週";
        btn.className = week === currentWeek ? "active" : "";
        btn.addEventListener("click", () => selectWeek(week));
        box.appendChild(btn);
      });
    }

    function selectWeek(week) {
      currentWeek = week;
      weekWords = wordsOf(week);
      renderWeeks();
      $("week-label").textContent = "第" + week + "週 · " + weekWords.length + " 個單字";
      $("page-header").hidden = true;
      $("weeks").hidden = true;
      $("week-note").hidden = true;
      $("study").hidden = false;
      document.body.classList.add("in-week");
      runMode = "all";
      startCards(false);
      startQuiz();
    }

    function backToWeeks() {
      $("page-header").hidden = false;
      $("weeks").hidden = false;
      $("week-note").hidden = false;
      $("study").hidden = true;
      document.body.classList.remove("in-week");
    }

    function wordKey(word) {
      return word.week + "::" + word.en;
    }

    function saveMastery() {
      localStorage.setItem(MASTERY_KEY, JSON.stringify(mastery));
    }

    function pileCounts() {
      let know = 0, unknown = 0, unset = 0;
      weekWords.forEach((w) => {
        const v = mastery[wordKey(w)];
        if (v === "know") know += 1;
        else if (v === "unknown") unknown += 1;
        else unset += 1;
      });
      return { know, unknown, unset };
    }

    function wordsForRun() {
      if (runMode === "unknown") {
        return weekWords.filter((w) => mastery[wordKey(w)] === "unknown");
      }
      return weekWords.slice();
    }

    function updatePileNote() {
      const { know, unknown, unset } = pileCounts();
      $("pile-note").textContent =
        "會 " + know + " · 不會 " + unknown + (unset ? " · 未分類 " + unset : "");
      $("review-unknown").disabled = unknown === 0;
    }

    function showCardPlay() {
      $("card-play").classList.remove("empty");
      $("card-summary").classList.remove("show");
    }

    function showCardSummary() {
      const { know, unknown, unset } = pileCounts();
      $("card-play").classList.add("empty");
      $("card-summary").classList.add("show");
      let text = "會 " + know + " 張，不會 " + unknown + " 張";
      if (unset) text += "，還有 " + unset + " 張未分類";
      $("card-summary-text").textContent = text + "。";
      $("retry-unknown").disabled = unknown === 0;
    }

    function showCard() {
      if (!runQueue.length) {
        showCardSummary();
        return;
      }
      showCardPlay();
      const word = runQueue[cardIndex];
      $("card-en").textContent = word.en;
      $("card-zh").textContent = word.zh;
      const prefix = runMode === "unknown" ? "只刷不會 · " : "";
      $("card-count").textContent = prefix + "第 " + (cardIndex + 1) + " / " + runQueue.length + " 張";
      $("card-progress").style.width = ((cardIndex + 1) / runQueue.length * 100) + "%";
      $("flashcard").classList.toggle("flipped", flipped);
      updatePileNote();
    }

    function flipCard() {
      flipped = !flipped;
      $("flashcard").classList.toggle("flipped", flipped);
    }

    function pickEnglishVoice() {
      const voices = window.speechSynthesis.getVoices() || [];
      const nameOf = (v) => (v.name || "").toLowerCase();
      const langOf = (v) => (v.lang || "").toLowerCase();
      return voices.find((v) => nameOf(v).includes("samantha") && langOf(v).startsWith("en"))
        || voices.find((v) => langOf(v).startsWith("en-us") && !nameOf(v).includes("fred"))
        || voices.find((v) => langOf(v).startsWith("en") && !nameOf(v).includes("fred"))
        || null;
    }

    function speakEnglish(text) {
      const word = String(text || "").trim();
      if (!word || !window.speechSynthesis) return;
      const utter = new SpeechSynthesisUtterance(word);
      utter.lang = "en-US";
      utter.rate = 0.72;
      const enVoice = pickEnglishVoice();
      if (enVoice) utter.voice = enVoice;
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
        window.speechSynthesis.cancel();
      }
      window.speechSynthesis.speak(utter);
    }

    function onFlashcardClick(event) {
      const wordEl = event.target.closest(".en");
      if (wordEl && $("flashcard").contains(wordEl)) {
        event.preventDefault();
        event.stopPropagation();
        speakEnglish(wordEl.textContent);
        return;
      }
      flipCard();
    }

    function startCards(reshuffle, mode) {
      if (mode) runMode = mode;
      runQueue = wordsForRun();
      if (reshuffle) runQueue = shuffle(runQueue);
      cardIndex = 0;
      flipped = false;
      markedThisRound = new Set();
      if (!runQueue.length) {
        showCardSummary();
        return;
      }
      showCard();
    }

    function markCard(kind) {
      const word = runQueue[cardIndex];
      if (!word) return;
      mastery[wordKey(word)] = kind;
      saveMastery();
      markedThisRound.add(wordKey(word));
      if (markedThisRound.size >= runQueue.length) {
        showCardSummary();
        return;
      }
      let next = cardIndex + 1;
      while (next < runQueue.length && markedThisRound.has(wordKey(runQueue[next]))) next += 1;
      if (next >= runQueue.length) {
        next = 0;
        while (next < runQueue.length && markedThisRound.has(wordKey(runQueue[next]))) next += 1;
      }
      cardIndex = next;
      flipped = false;
      showCard();
    }

    function resetMastery() {
      weekWords.forEach((w) => { delete mastery[wordKey(w)]; });
      saveMastery();
      runMode = "all";
      startCards(false);
    }

    function startUnknownOnly() {
      if (pileCounts().unknown === 0) return;
      startCards(true, "unknown");
    }

    function makeOptions(word) {
      const same = shuffle(
        weekWords.filter((w) => w.en !== word.en).map((w) => w.zh)
      );
      const others = shuffle(
        WORDS.filter((w) => w.en !== word.en && w.zh !== word.zh && !same.includes(w.zh))
          .map((w) => w.zh)
      );
      const extras = [];
      const fallback = ["練習", "記得", "句子", "意思"];
      const pool = same.concat(others).concat(fallback);
      for (const zh of pool) {
        if (zh !== word.zh && !extras.includes(zh)) extras.push(zh);
        if (extras.length === 3) break;
      }
      return shuffle([word.zh].concat(extras));
    }

    function renderChoices(options, correctZh) {
      const box = $("choices");
      box.classList.remove("shake");
      box.innerHTML = "";
      options.forEach((zh, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "choice";
        btn.innerHTML = '<span class="mark">' + LETTERS[i] + '</span><span class="label"></span>';
        btn.querySelector(".label").textContent = zh;
        btn.addEventListener("click", () => pickChoice(btn, zh, correctZh));
        box.appendChild(btn);
      });
    }

    function showQuiz() {
      const word = quizSet[quizIndex];
      $("quiz-play").classList.remove("empty");
      $("quiz-summary").classList.remove("show");
      $("quiz-en").textContent = word.en;
      $("quiz-word").classList.remove("pulse");
      $("feedback").textContent = "";
      $("feedback").className = "feedback";
      answered = false;
      $("next-quiz").disabled = true;
      $("next-quiz").textContent = quizIndex === quizSet.length - 1 ? "看結果" : "下一題";
      $("quiz-progress").textContent = "第 " + (quizIndex + 1) + " / " + quizSet.length + " 題";
      $("quiz-score").textContent = "答對 " + correctCount;
      $("quiz-bar").style.width = ((quizIndex + 1) / quizSet.length * 100) + "%";
      renderChoices(makeOptions(word), word.zh);
    }

    function pickChoice(btn, zh, correctZh) {
      if (answered) return;
      answered = true;
      const buttons = [...document.querySelectorAll(".choice")];
      buttons.forEach((el) => {
        el.disabled = true;
        if (el.querySelector(".label").textContent === correctZh) el.classList.add("correct");
      });
      if (zh === correctZh) {
        correctCount += 1;
        $("feedback").textContent = "答對了，做得好！";
        $("feedback").className = "feedback ok";
        $("quiz-word").classList.add("pulse");
      } else {
        btn.classList.add("wrong");
        $("feedback").textContent = "答錯了，正確是「" + correctZh + "」";
        $("feedback").className = "feedback bad";
        $("choices").classList.remove("shake");
        void $("choices").offsetWidth;
        $("choices").classList.add("shake");
      }
      $("quiz-score").textContent = "答對 " + correctCount;
      $("next-quiz").disabled = false;
    }

    function finishQuiz() {
      $("quiz-play").classList.add("empty");
      $("quiz-summary").classList.add("show");
      $("quiz-summary-text").textContent =
        "第" + currentWeek + "週這一組答對 " + correctCount + "／共 " + quizSet.length + " 題";
    }

    function nextQuiz() {
      if (!answered) return;
      if (quizIndex < quizSet.length - 1) {
        quizIndex += 1;
        showQuiz();
      } else {
        finishQuiz();
      }
    }

    function startQuiz() {
      const count = Math.min(QUESTIONS_PER_SET, weekWords.length);
      quizSet = shuffle(weekWords).slice(0, count);
      quizIndex = 0;
      correctCount = 0;
      if (!quizSet.length) return;
      showQuiz();
    }

    function switchMode(mode) {
      const isCard = mode === "card";
      $("tab-card").classList.toggle("active", isCard);
      $("tab-quiz").classList.toggle("active", !isCard);
      $("panel-card").classList.toggle("active", isCard);
      $("panel-quiz").classList.toggle("active", !isCard);
    }

    $("tab-card").addEventListener("click", () => switchMode("card"));
    $("tab-quiz").addEventListener("click", () => switchMode("quiz"));
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", () => {
        window.speechSynthesis.getVoices();
      });
    }
    $("flashcard").addEventListener("click", onFlashcardClick);
    $("shuffle-card").addEventListener("click", () => startCards(true));
    $("mark-know").addEventListener("click", () => markCard("know"));
    $("mark-unknown").addEventListener("click", () => markCard("unknown"));
    $("reset-cards").addEventListener("click", resetMastery);
    $("review-unknown").addEventListener("click", startUnknownOnly);
    $("retry-unknown").addEventListener("click", startUnknownOnly);
    $("retry-all-cards").addEventListener("click", () => startCards(true, "all"));
    $("next-quiz").addEventListener("click", nextQuiz);
    $("retry-quiz").addEventListener("click", startQuiz);
    $("back-weeks").addEventListener("click", backToWeeks);

    document.addEventListener("keydown", (e) => {
      if (!$("panel-card").classList.contains("active")) return;
      if (e.key === " " || e.key === "Enter") {
        e.preventDefault();
        flipCard();
      }
    });

    renderWeeks();
    $("week-note").textContent = "選一週開始練習";
  </script>
</body>
</html>
